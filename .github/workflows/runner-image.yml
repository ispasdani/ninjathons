name: Runner image

# Builds runner/Dockerfile, smoke-tests it, and pushes it to Vercel Container
# Registry as runner:<commit sha>, where Vercel Sandbox boots it
# (docs/notes/decisions.md §5). Any branch pushes, so an image can be timed in
# the sandbox before it is merged; only main moves the `latest` tag. Convex
# picks a tag with SANDBOX_IMAGE.
#
# Needs, once:
# - a VCR OIDC policy on the Vercel team: GitHub Actions, claim
#   repository = ispasdani/ninjathons, read and write, project ninjathons;
# - the VCR repository `runner` in the ninjathons project (Images → Create
#   Repository): the OIDC token can push but not create repositories;
# - the repository variables VERCEL_TEAM_ID (team_...) and VERCEL_TEAM_SLUG.

on:
  push:
    paths: [runner/**, .github/workflows/runner-image.yml]
  workflow_dispatch:

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE: vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/ninjathons/runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: runner
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: runner:test

      - name: Smoke test (compile and run in every language)
        run: docker run --rm -v "$PWD/runner/smoke:/smoke:ro" runner:test sh /smoke/run.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Image size
        run: |
          docker image ls runner:test --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to VCR
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      # Same build again (all cached), pushed with the zstd compression VCR
      # recommends for Sandbox images.
      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: runner
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

      # TEMPORARY: why VCR refuses the push. Prints no secrets.
      - name: Diagnose VCR access
        if: failure()
        env:
          TEAM: ${{ vars.VERCEL_TEAM_ID }}
          SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
        run: |
          auth=$(jq -r ".auths[\"vcr.vercel.com\"].auth // empty" ~/.docker/config.json | base64 -d)
          user="${auth%%:*}"; token="${auth#*:}"
          echo "docker user: $user (team var: $TEAM, slug var: $SLUG)"
          echo "token claims (no signature):"
          echo "$token" | cut -d. -f2 | tr "_-" "/+" | base64 -d 2>/dev/null | jq "del(.jti)" || echo "not a JWT"
          echo "tags/list:"
          curl -s -u "$auth" "https://vcr.vercel.com/v2/$SLUG/ninjathons/runner/tags/list"; echo
          echo "repositories visible to this token:"
          curl -s -H "Authorization: Bearer $token" "https://api.vercel.com/v1/vcr/repository?teamId=$TEAM" | jq -c . | head -c 3000; echo

      # Sandbox can only boot the image once VCR has prepared it.
      - name: Wait until Sandbox can use it
        uses: vercel/vcr-action/wait-for-optimized-image@v1
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          timeout-seconds: 900

      - name: Summary
        run: |
          echo "Pushed runner:${GITHUB_SHA} (${DIGEST}), ready for Sandbox." >> "$GITHUB_STEP_SUMMARY"
          echo "Set SANDBOX_IMAGE=runner:${GITHUB_SHA} in Convex to use it." >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
