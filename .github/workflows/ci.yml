name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so `next build` can run. CI deploys nothing and calls no
      # real service, so no secrets are needed here.
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Tests and problems:check run code in the runner image, so every
      # language is checked with the compilers the sandbox uses. The layers
      # are shared with the Runner image workflow through the GitHub cache.
      - uses: docker/setup-buildx-action@v3
      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          load: true
          tags: ninjathons-runner:local

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:once
        env:
          RUNNER: docker
      - name: Check problems
        run: npm run problems:check
        env:
          RUNNER: docker
      - name: Build
        run: npm run build
